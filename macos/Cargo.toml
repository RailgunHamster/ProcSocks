[package]
name = "procsocks"
version = "0.1.0"
edition = "2024"
description = "Per-process SOCKS5 router with TLS SNI recovery (Windows: NetFilter SDK, macOS: pf)"
license = "GPL-3.0-only"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
sha2 = "0.10"
tracing-appender = "0.2"
windows-service = "0.8"
